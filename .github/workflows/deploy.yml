name: Build and deploy

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: api-jdr
            image: lsr-api-jdr
          - target: api-yeardiary
            image: lsr-api-yeardiary
          - target: api-recalbox
            image: lsr-api-recalbox
          - target: web-misc
            image: lsr-web
          - target: web-recalbox
            image: lsr-web-recalbox
          - target: admin-jdr
            image: lsr-admin-jdr
          - target: golarion-map
            image: lsr-golarion-map
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/linux/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/valerianguivarch/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/valerianguivarch/${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    name: Deploy mini-PC
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Join private Tailscale network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Pull images and restart Compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_ed25519 "valou@$DEPLOY_HOST" \
            "set -e; \
             DEPLOY_DIR=/home/valou/services/lsr-nestjs-deploy; \
             SOURCE_DIR=/home/valou/services/lsr-nestjs-backend; \
             if [ ! -d \"\$DEPLOY_DIR/.git\" ]; then \
               git clone --quiet https://github.com/ValerianGuivarch/lsr-nestjs-backend.git \"\$DEPLOY_DIR\"; \
               cp -a \"\$SOURCE_DIR/.env\" \"\$DEPLOY_DIR/.env\"; \
               printf '\nAPP_STATE_DIR=/home/valou/services/lsr-nestjs-backend\nAPP_STORAGE_DIR=/home/valou/services/lsr-nestjs-backend/storage\n' >> \"\$DEPLOY_DIR/.env\"; \
             fi; \
             cd \"\$DEPLOY_DIR\"; \
             git fetch --quiet origin main; \
             REMOTE_HEAD=\$(git rev-parse FETCH_HEAD); \
             if [ \"\$REMOTE_HEAD\" != '${GITHUB_SHA}' ]; then \
               echo \"[deploy] skipping obsolete run ${GITHUB_SHA}; main is now \$REMOTE_HEAD\"; \
               exit 0; \
             fi; \
             if ! git diff --quiet || ! git diff --cached --quiet; then \
               echo '[deploy] dedicated checkout contains tracked local changes' >&2; \
               exit 1; \
             fi; \
             git checkout --quiet --detach '${GITHUB_SHA}'; \
             docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null; \
             ./deploy/linux/scripts/deploy-main.sh '${GITHUB_SHA}'; \
             rc=\$?; docker logout ghcr.io >/dev/null 2>&1 || true; exit \$rc"

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          cp .env.tpl .env
          docker compose -f deploy/linux/docker-compose.yml config >/dev/null

      - name: Build API JdR image
        run: docker build -f deploy/linux/Dockerfile --target api-jdr -t lsr-api-jdr:ci .

      - name: Build YearDiary API image
        run: docker build -f deploy/linux/Dockerfile --target api-yeardiary -t lsr-api-yeardiary:ci .

      - name: Build public web image
        run: docker build -f deploy/linux/Dockerfile --target web-misc -t lsr-web:ci .

      - name: Build admin image
        run: docker build -f deploy/linux/Dockerfile --target admin-jdr -t lsr-admin-jdr:ci .

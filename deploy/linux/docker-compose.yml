name: lsr-app

services:
  api-jdr:
    image: ghcr.io/valerianguivarch/lsr-api-jdr:${APP_VERSION:-main}
    build:
      context: ../..
      dockerfile: deploy/linux/Dockerfile
      target: api-jdr
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-../../.env}
    environment:
      HOST: 0.0.0.0
      JDR_PORT: 3333
      NODE_OPTIONS: --max-old-space-size=4096
      SQLITE_PATH: /app/data/pf2.sqlite
      JDR_SQLITE_DATABASE: /app/data/jdr-database.sqlite
      PF2_LIBRARY_ROOT: /app/pf2-library
      STORAGE_PATH: /app/storage
      FOUNDRY_ASSETS_ROOT: /app/foundry-assets
      FOUNDRY_REST_URL: http://host.docker.internal:3010
      PF2_MEDIAWIKI_API_URL: http://host.docker.internal:4205/api.php
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${APP_STATE_DIR:-../..}/pf2.sqlite:/app/data/pf2.sqlite
      - ${APP_STATE_DIR:-../..}/jdr-database.sqlite:/app/data/jdr-database.sqlite
      - ${APP_STORAGE_DIR:-../../storage}:/app/storage
      - ${PF2_LIBRARY_DIR:-../../../pf2-data}:/app/pf2-library:ro
      - ${PF2_LIBRARY_DIR:-../../../pf2-data}/_AI:/app/pf2-library/_AI
      - ${PF2_LIBRARY_DIR:-../../../pf2-data}/_Foundry:/app/pf2-library/_Foundry
      - ${FOUNDRY_ASSETS_DIR:-../../../foundry/data/Data/assets/l7r}:/app/foundry-assets:ro
    ports:
      - '3333:3333'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3333/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api-recalbox:
    image: ghcr.io/valerianguivarch/lsr-api-recalbox:${APP_VERSION:-main}
    build:
      context: ../..
      dockerfile: deploy/linux/Dockerfile
      target: api-recalbox
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-../../.env}
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      RECALBOX_API_PORT: 3335
      RECALBOX_HOST: ${RECALBOX_HOST:-192.168.1.3}
      RECALBOX_SHARE_ROOT: /recalbox/share
      RECALBOX_SYSTEM_ROOT: /recalbox/share/system
      RECALBOX_INBOX_ROOT: /recalbox-inbox
    volumes:
      - ${RECALBOX_SHARE_DIR:-../../../recalbox/share}:/recalbox/share
      - ${RECALBOX_INBOX_DIR:-../../../roms}:/recalbox-inbox
    expose:
      - '3335'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3335/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api-yeardiary:
    image: ghcr.io/valerianguivarch/lsr-api-yeardiary:${APP_VERSION:-main}
    build:
      context: ../..
      dockerfile: deploy/linux/Dockerfile
      target: api-yeardiary
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-../../.env}
    environment:
      HOST: 0.0.0.0
      YEARDIARY_PORT: 8081
      YEARDIARY_SQLITE_DATABASE: /app/data/database.sqlite
      API_MAIN_ORIGIN: http://api-jdr:3333
    volumes:
      - ${APP_STATE_DIR:-../..}/database.sqlite:/app/data/database.sqlite
    ports:
      - '8081:8081'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:8081/api/v1/diaries'').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web-recalbox:
    image: ghcr.io/valerianguivarch/lsr-web-recalbox:${APP_VERSION:-main}
    build:
      context: ../..
      dockerfile: deploy/linux/Dockerfile
      target: web-recalbox
    restart: unless-stopped
    depends_on:
      api-recalbox:
        condition: service_healthy
    expose:
      - '80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    image: ghcr.io/valerianguivarch/lsr-web:${APP_VERSION:-main}
    build:
      context: ../..
      dockerfile: deploy/linux/Dockerfile
      target: web-misc
    restart: unless-stopped
    depends_on:
      api-jdr:
        condition: service_healthy
      api-yeardiary:
        condition: service_healthy
    ports:
      - '3000:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 6

  admin:
    image: ghcr.io/valerianguivarch/lsr-admin-jdr:${APP_VERSION:-main}
    build:
      context: ../..
      dockerfile: deploy/linux/Dockerfile
      target: admin-jdr
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-../../.env}
    depends_on:
      api-jdr:
        condition: service_healthy
    ports:
      - '4203:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 5s
      retries: 6

  map:
    image: ghcr.io/valerianguivarch/lsr-golarion-map:${APP_VERSION:-main}
    build:
      context: ../..
      dockerfile: deploy/linux/Dockerfile
      target: golarion-map
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-../../.env}
    environment:
      GOLARION_MAP_HOST: 0.0.0.0
      GOLARION_MAP_PORT: 4204
      GOLARION_MAP_ASSETS_DIR: /app/map-assets
      GOLARION_MAP_PLACES_URL: https://l7r.fr/apil7r/pf2-mj/map/places
    volumes:
      - ${GOLARION_MAP_ASSETS_HOST_DIR:-../../../golarion-map-build/mapping/frontend/public}:/app/map-assets:ro
    ports:
      - '4204:4204'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:4204/mj'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

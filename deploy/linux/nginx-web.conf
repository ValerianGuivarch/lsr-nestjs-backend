server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve optional Docker services at request time so a missing Recalbox
  # backend cannot prevent the main web app from starting.
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $recalbox_backend api-recalbox:3335;

  location /apil7r/recalbox/ {
    rewrite ^/apil7r/recalbox/(.*)$ /api/$1 break;
    proxy_pass http://$recalbox_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Compatibility aliases for older Recalbox front-end bundles/bookmarks.
  # Keep these while clients may still have a cached bundle using the old paths.
  location /recalbox/api/ {
    rewrite ^/recalbox/api/(.*)$ /api/$1 break;
    proxy_pass http://$recalbox_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/recalbox/ {
    rewrite ^/api/recalbox/(.*)$ /api/$1 break;
    proxy_pass http://$recalbox_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /apil7r/pf2-mj/ {
    proxy_pass http://api-jdr:3333/api/pf2-mj/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /apil7r/foundry/ {
    proxy_pass http://api-jdr:3333/foundry/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /apil7r/jdr/ {
    proxy_pass http://api-jdr:3333/api/v1/jdr/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /apil7r/v1/diaries/ {
    proxy_pass http://api-yeardiary:8081/api/v1/diaries/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /apil7r/ {
    proxy_pass http://api-yeardiary:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://api-jdr:3333/health;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

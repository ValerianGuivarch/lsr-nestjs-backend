server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /apil7r/pf2-mj/ {
    proxy_pass http://api-jdr:3333/api/pf2-mj/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /apil7r/jdr/ {
    proxy_pass http://api-jdr:3333/api/v1/jdr/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /apil7r/v1/diaries/ {
    proxy_pass http://api-yeardiary:8081/api/v1/diaries/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /apil7r/ {
    proxy_pass http://api-yeardiary:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://api-jdr:3333/health;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

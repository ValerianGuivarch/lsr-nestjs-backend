services:
  bookstack-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bookstack
      MYSQL_USER: bookstack
      MYSQL_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${BOOKSTACK_DB_ROOT_PASSWORD}
    volumes:
      - ${BOOKSTACK_DATA_ROOT:-./data/bookstack}/database:/var/lib/mysql

  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    restart: unless-stopped
    depends_on:
      - bookstack-db
    ports:
      - "${BOOKSTACK_PORT:-4205}:80"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Paris}
      APP_URL: ${BOOKSTACK_APP_URL:-http://localhost:4205}
      APP_KEY: ${BOOKSTACK_APP_KEY}
      DB_HOST: bookstack-db
      DB_PORT: 3306
      DB_DATABASE: bookstack
      DB_USERNAME: bookstack
      DB_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
    volumes:
      - ${BOOKSTACK_DATA_ROOT:-./data/bookstack}/config:/config
